<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 290" role="img" aria-label="nobug">
<style>
.nb .mark{animation:nb-slide .55s cubic-bezier(.65,0,.35,1) .95s both}
.nb .pop{transform-origin:135px 134px;animation:nb-pop .45s cubic-bezier(.34,1.8,.64,1) both}
.nb .s{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 200}
.nb .bar,.nb .diag{stroke:#F0A93E;stroke-width:39;animation:nb-draw .8s cubic-bezier(.33,1,.68,1) .3s both}
.nb .tick{stroke:#FFFFFF;stroke-width:37;animation:nb-draw .55s cubic-bezier(.65,0,.35,1) 2.2s both}
.nb .tb{transform-origin:167.5px 248.6px;animation:nb-bounce .35s ease-in-out 2.7s both}
.nb .seed{fill:#F0A93E;transform-box:fill-box;transform-origin:center;animation:nb-seed .35s cubic-bezier(.34,1.8,.64,1) both}
.nb .cb,.nb .kb{transform-box:fill-box;transform-origin:center;animation:nb-burst .55s cubic-bezier(.33,1,.68,1) both}
.nb .cb{fill:#F0A93E;animation-delay:.98s}
.nb .kb{fill:#FFFFFF;animation-delay:2.75s}
.nb .l{fill:#FFFFFF;animation:nb-rise .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(1.4s + var(--i) * .07s)}
@keyframes nb-slide{from{transform:translateX(335px)}to{transform:none}}
@keyframes nb-pop{from{transform:scale(.6)}to{transform:none}}
@keyframes nb-seed{from{transform:scale(0)}to{transform:none}}
@keyframes nb-draw{from{stroke-dashoffset:101;opacity:0}1%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes nb-bounce{50%{transform:scale(1.1)}}
@keyframes nb-burst{0%{transform:none;opacity:0}1%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:1}}
@keyframes nb-rise{from{transform:translateY(60px) scale(0);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.nb *{animation:none!important}.nb .cb,.nb .kb{opacity:0}}
</style>
