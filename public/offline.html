<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline — nobug</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f9fa;color:#0b1f3a;font-family:"Inter Tight",Inter,system-ui,sans-serif;text-align:center;padding:24px}
  .k{font:500 11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6b6862}
  h1{font-size:28px;font-weight:500;letter-spacing:-.02em;margin:16px 0 8px}
  p{margin:6px 0;color:#6b6862;font-size:16px;line-height:1.5}
  button{margin-top:24px;padding:12px 22px;border:0;border-radius:999px;background:#efa83c;color:#0b1f3a;font:500 15px/1 inherit;cursor:pointer}
</style>
</head>
<body>
  <div>
    <div class="k">nobug · offline</div>
    <h1>İnternet bağlantısı yoxdur</h1>
    <p>Bağlantı bərpa olunanda səhifə yenidən yüklənəcək.</p>
    <p>You are offline — the page will reload once the connection is back.</p>
    <p>Нет подключения к интернету — страница перезагрузится, когда связь восстановится.</p>
    <button onclick="location.reload()">Yenidən yüklə · Retry · Повторить</button>
  </div>
  <script>window.addEventListener("online",()=>location.reload())</script>
</body>
</html>
